name: Android Native APK

on:
  pull_request:
    paths:
      - '.github/workflows/android-native-ci.yml'
      - '.github/actions/setup-android/**'
      - 'apps/android/**'
      - 'packages/yaqmc-client/fixtures/**'
      - 'crates/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-native-ci.yml'
      - '.github/actions/setup-android/**'
      - 'apps/android/**'
      - 'packages/yaqmc-client/fixtures/**'
      - 'crates/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-native:
    name: Build, test and package ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - uses: ./.github/actions/setup-android
      - name: Install workspace dependencies
        run: npm ci
      - name: Build native ARM64 benchmark APK and run JVM tests
        run: node scripts/build-android-native.mjs
      - name: Run native Android lint and shared-host tests
        run: node scripts/run-android-gradle.mjs :nativeApp:lintDebug :app:testDebugUnitTest
      - name: Verify APK signature and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release-android/YAQMC-*-android-native-benchmark.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one benchmark APK, found ${#apks[@]}" >&2
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "${apks[0]}"
          unzip -Z1 "${apks[0]}" | grep -Fx 'lib/arm64-v8a/libyaqmc_core.so'
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "${apks[0]}" | grep -F "package: name='org.yaqmc.android.nativeui'"
          (cd release-android && sha256sum -- *-android-native-benchmark.apk > SHA256SUMS-native.txt)
          (cd release-android && sha256sum --check SHA256SUMS-native.txt)
      - name: Upload installable native APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: YAQMC-native-benchmark-arm64-${{ github.sha }}
          path: |
            release-android/*-android-native-benchmark.apk
            release-android/SHA256SUMS-native.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: YAQMC-native-test-reports-${{ github.sha }}
          path: |
            apps/android/android/nativeApp/build/reports/tests/
            apps/android/android/nativeApp/build/test-results/
            apps/android/android/nativeApp/build/reports/lint-results-*.html
            apps/android/android/nativeApp/build/reports/lint-results-*.xml
            apps/android/android/app/build/reports/tests/
            apps/android/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-emulator:
    name: Offline Compose emulator smoke (x86_64)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: android-native
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      YAQMC_ANDROID_NATIVE_ABI: x86_64
      YAQMC_ANDROID_OFFLINE_UI_TESTS: '1'
      YAQMC_ANDROID_NATIVE_LIB_DIR: ${{ github.workspace }}/apps/android/android/nativeApp/build/generated/jniLibs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - uses: ./.github/actions/setup-android
      - name: Install workspace dependencies
        run: npm ci
      - name: Build x86_64 JNI bridge for emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$YAQMC_ANDROID_NATIVE_LIB_DIR"
          cargo ndk -P 26 -t x86_64 -o "$YAQMC_ANDROID_NATIVE_LIB_DIR" build --release --locked -p yaqmc-android
          test -s "$YAQMC_ANDROID_NATIVE_LIB_DIR/x86_64/libyaqmc_core.so"
      - name: Build native emulator APK and instrumentation tests
        run: node scripts/run-android-gradle.mjs :nativeApp:assembleDebug :nativeApp:assembleDebugAndroidTest
      - name: Enable KVM on Linux runner
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated Android UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/run-native-emulator-smoke.sh
      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: YAQMC-native-emulator-evidence-${{ github.sha }}
          path: artifacts/android-emulator/
          if-no-files-found: ignore
          retention-days: 7

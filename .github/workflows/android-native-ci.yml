name: Android Native APK

on:
  pull_request:
    paths:
      - '.github/workflows/android-native-ci.yml'
      - '.github/actions/setup-android/**'
      - 'apps/android/**'
      - 'crates/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-native-ci.yml'
      - '.github/actions/setup-android/**'
      - 'apps/android/**'
      - 'crates/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-native:
    name: Build, test and package ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - uses: ./.github/actions/setup-android
      - name: Install workspace dependencies
        run: npm ci
      - name: Build native ARM64 benchmark APK and run JVM tests
        run: node scripts/build-android-native.mjs
      - name: Run native Android lint and shared-host tests
        run: node scripts/run-android-gradle.mjs :nativeApp:lintDebug :app:testDebugUnitTest
      - name: Verify APK signature and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release-android/YAQMC-*-android-native-benchmark.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one benchmark APK, found ${#apks[@]}" >&2
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "${apks[0]}"
          (cd release-android && sha256sum -- *-android-native-benchmark.apk > SHA256SUMS-native.txt)
          (cd release-android && sha256sum --check SHA256SUMS-native.txt)
      - name: Upload installable native APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: YAQMC-native-benchmark-arm64-${{ github.sha }}
          path: |
            release-android/*-android-native-benchmark.apk
            release-android/SHA256SUMS-native.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: YAQMC-native-test-reports-${{ github.sha }}
          path: |
            apps/android/android/nativeApp/build/reports/tests/
            apps/android/android/nativeApp/build/test-results/
            apps/android/android/nativeApp/build/reports/lint-results-*.html
            apps/android/android/nativeApp/build/reports/lint-results-*.xml
            apps/android/android/app/build/reports/tests/
            apps/android/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

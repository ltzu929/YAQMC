name: Android native verification

on:
  pull_request:
    paths:
      - 'apps/android/android/nativeApp/**'
      - 'apps/android/android/app/**'
      - '.github/workflows/android-native-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-and-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.88.0'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Locate pinned Rust TLS Android Maven artifact
        run: |
          echo "YAQMC_RUSTLS_VERIFIER_MAVEN_DIR=$(node --input-type=module -e 'import {resolveRustlsVerifierMaven} from "./scripts/build-android.mjs"; console.log(resolveRustlsVerifierMaven())')" >> "$GITHUB_ENV"
      - name: Compile, test, lint and assemble native Android
        working-directory: apps/android/android
        run: bash ./gradlew --no-daemon :nativeApp:testDebugUnitTest :nativeApp:lintDebug :nativeApp:assembleDebug :nativeApp:assembleDebugAndroidTest
      - name: Upload reviewable debug and instrumentation APKs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yaqmc-native-review-apks-${{ github.sha }}
          path: |
            apps/android/android/nativeApp/build/outputs/apk/debug/
            apps/android/android/nativeApp/build/outputs/apk/androidTest/debug/
          if-no-files-found: error
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-native-reports-${{ github.sha }}
          path: |
            apps/android/android/nativeApp/build/reports/
            apps/android/android/nativeApp/build/test-results/
          if-no-files-found: ignore

  emulator-ui:
    needs: kotlin-and-apk
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.88.0'
      - run: npm ci
      - name: Resolve native Maven dependency
        run: |
          echo "YAQMC_RUSTLS_VERIFIER_MAVEN_DIR=$(node --input-type=module -e 'import {resolveRustlsVerifierMaven} from "./scripts/build-android.mjs"; console.log(resolveRustlsVerifierMaven())')" >> "$GITHUB_ENV"
      - name: Enable hardware virtualization
        run: sudo chmod 666 /dev/kvm
      - name: Run API ${{ matrix.api-level }} offline UI instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: cd apps/android/android && bash gradlew --no-daemon :nativeApp:connectedDebugAndroidTest
      - name: Upload UI instrumentation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-native-ui-report-api${{ matrix.api-level }}-${{ github.sha }}
          path: |
            apps/android/android/nativeApp/build/reports/androidTests/
            apps/android/android/nativeApp/build/outputs/androidTest-results/
          if-no-files-found: ignore

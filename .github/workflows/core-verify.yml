name: Android Core and repository checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run docs:check
      - run: npm run format:check
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p yaqmc-core -p yaqmc-protocol -p yaqmc-provider-api -p yaqmc-provider-qqmusic --all-targets --locked -- -D warnings
      - run: cargo test -p yaqmc-core -p yaqmc-protocol -p yaqmc-provider-api -p yaqmc-provider-qqmusic --all-targets --locked
      - run: npm run contracts:check

[package]
name = "yaqmc-core"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = ["dep:tempfile"]
test-provider = ["test-support"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
keyring = "4.1.6"
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls", "stream", "system-proxy"] }
rodio = { version = "0.22.2", default-features = false, features = ["flac", "mp3", "mp4", "playback", "tracing", "wav"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yaqmc-protocol = { path = "../yaqmc-protocol" }
yaqmc-provider-api = { path = "../yaqmc-provider-api" }
yaqmc-provider-qqmusic = { path = "../yaqmc-provider-qqmusic" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "test-util", "time"] }
